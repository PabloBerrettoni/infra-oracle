#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - iptables-persistent

runcmd:
  # 1. Firewall: Crafty (${crafty_http_port}/${crafty_https_port}), Minecraft (${minecraft_port}), web (80/443), SSH (22)
  - iptables -I INPUT -p tcp --dport ${crafty_http_port} -j ACCEPT
  - iptables -I INPUT -p tcp --dport ${crafty_https_port} -j ACCEPT
  - iptables -I INPUT -p tcp --dport ${minecraft_port} -j ACCEPT
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 22 -j ACCEPT
  - iptables-save > /etc/iptables/rules.v4

  # 2. Pull Crafty Controller (multi-arch image, runs on arm64)
  - docker pull arcadiatechnology/crafty-4:latest

  # 3. Run Crafty - Web UI that manages the PaperMC server
  - mkdir -p /opt/crafty/appdata /opt/crafty/logs /opt/crafty/backups
  - docker run -d --name crafty --restart unless-stopped -p ${crafty_http_port}:${crafty_http_port} -p ${crafty_https_port}:${crafty_https_port} -p ${minecraft_port}:${minecraft_port} -e TZ=${timezone} -v /opt/crafty/appdata:/crafty/appdata -v /opt/crafty/logs:/crafty/logs -v /opt/crafty/backups:/crafty/backups --cap-add NET_ADMIN arcadiatechnology/crafty-4:latest

  # 4. HTTPS reverse proxy: nginx (Crafty's documented WebSocket-safe recipe) + Let's Encrypt
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - iptables-save > /etc/iptables/rules.v4
  - mkdir -p /opt/nginx-shared/conf /opt/nginx-shared/certs /opt/nginx-shared/webroot
  - docker pull nginx:alpine
  - docker pull certbot/certbot
  # Issue cert on a fresh box (port 80 is free at first boot; standalone ACME)
  - docker run --rm -p 80:80 -v /opt/nginx-shared/certs:/etc/letsencrypt certbot/certbot certonly --standalone -d ${domain} -m ${email} --agree-tos --no-eff-email --non-interactive
  - |
    cat > /opt/nginx-shared/conf/crafty.conf <<'CONF'
    server {
        listen 80;
        server_name ${domain};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name ${domain};
        ssl_certificate     /etc/nginx/certs/live/${domain}/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/${domain}/privkey.pem;
        client_max_body_size 0;
        location / {
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass https://host.docker.internal:${crafty_https_port};
            proxy_ssl_verify off;
            proxy_buffering off;
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }
    CONF
  - docker run -d --name nginx-crafty --restart unless-stopped --add-host host.docker.internal:host-gateway -p 80:80 -p 443:443 -v /opt/nginx-shared/certs:/etc/nginx/certs:ro -v /opt/nginx-shared/conf:/etc/nginx/conf.d:ro -v /opt/nginx-shared/webroot:/var/www/certbot nginx:alpine
  # Weekly cert renewal (webroot through nginx) + reload
  - (crontab -l 2>/dev/null; echo "0 3 * * 1 docker run --rm -v /opt/nginx-shared/certs:/etc/letsencrypt -v /opt/nginx-shared/webroot:/var/www/certbot certbot/certbot renew --webroot -w /var/www/certbot --quiet && docker exec nginx-crafty nginx -s reload || true") | crontab -

  # 5. Create the PaperMC server from the Crafty UI once up (https://${domain}).
  #    Default admin credentials are auto-generated on first boot - get them with:
  #    sudo docker exec crafty cat /crafty/app/config/default-creds.txt