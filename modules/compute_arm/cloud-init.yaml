#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - iptables-persistent

runcmd:
  # 1. Firewall: Crafty web UI (8000/8443), Minecraft (25565), SSH (22)
  - iptables -I INPUT -p tcp --dport 8000 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 8443 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 25565 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 22 -j ACCEPT
  - iptables-save > /etc/iptables/rules.v4

  # 2. Pull Crafty Controller (multi-arch image, runs on arm64)
  - docker pull arcadiatechnology/crafty-4:latest

  # 3. Run Crafty - Web UI that manages the PaperMC server
  #    NOTE: must be a single line - cloud-init YAML mangles multi-line
  #    backslash continuations into invalid args (exit 125).
  - mkdir -p /opt/crafty/appdata /opt/crafty/logs /opt/crafty/backups
  - docker run -d --name crafty --restart unless-stopped -p 8000:8000 -p 8443:8443 -p 25565:25565 -e TZ=America/Argentina/Buenos_Aires -v /opt/crafty/appdata:/crafty/appdata -v /opt/crafty/logs:/crafty/logs -v /opt/crafty/backups:/crafty/backups --cap-add NET_ADMIN arcadiatechnology/crafty-4:latest

  # 4. HTTPS reverse proxy: Caddy (auto Let's Encrypt cert, auto-renew)
  #    Proxies crafty.pabloberrettoni.com -> crafty:8443 on port 443
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - iptables-save > /etc/iptables/rules.v4
  - mkdir -p /opt/caddy/data /opt/caddy/config
  - printf '%s\n' '{' '    email pabloberrettoni98@gmail.com' '}' '' 'crafty.pabloberrettoni.com {' '    reverse_proxy host.docker.internal:8443 {' '        transport http {' '            tls_insecure_skip_verify' '        }' '    }' '}' > /opt/caddy/Caddyfile
  - docker pull caddy:2
  - docker run -d --name caddy --restart unless-stopped --add-host host.docker.internal:host-gateway -p 80:80 -p 443:443 -v /opt/caddy/Caddyfile:/etc/caddy/Caddyfile -v /opt/caddy/data:/data -v /opt/caddy/config:/config caddy:2

  # 5. Create the PaperMC server from the Crafty UI once up (https://crafty.pabloberrettoni.com).
  #    Default admin credentials are auto-generated on first boot - get them with:
  #    sudo docker exec crafty cat /crafty/app/config/default-creds.txt